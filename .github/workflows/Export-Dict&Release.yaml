name: Export RIME Dict & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '输入导出的版本名 (留空则自动生成)'
        required: false
        default: ''
  # 👇【新增】当同步词库的 Action 运行完成后，自动触发此 Action
  workflow_run:
    workflows: ["Sync Rime Ice Dicts"] # 注意：必须和第一个 Action 的 name 完全一致
    types:
      - completed

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Grant execute permission for export.sh
        run: chmod +x export.sh

      - name: Run export.sh
        id: export
        run: |
          # 计算版本号
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="custom-${GITHUB_RUN_NUMBER}"
          fi
          
          # 存入环境变量，供后续步骤使用
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          
          echo "Using version: $VERSION"
          ./export.sh "$VERSION"
          echo "=== Generated files ==="
          ls -la dict/

      - name: Verify dict file exists
        run: |
          if [ -z "$(ls -A dict/*.dict 2>/dev/null)" ]; then
            echo "No .dict file found!"
            exit 1
          fi

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "dict-${{ env.VERSION }}"
          name: "FUTO Keyboard Chinese Dict Rime_Ice - ${{ env.VERSION }}"
          body: |
            Automated dictionary export from commit ${{ github.sha }}
            Version: ${{ env.VERSION }}
          draft: false
          prerelease: false
          files: dict/rime_ice.dict  # 👈 改成固定名字

      - name: Trigger FUTO Keyboard Build
        uses: peter-evans/repository-dispatch@v3
        with:
          repository: 709052264/futo-keyboard # 👈 你的目标仓库
          token: ${{ secrets.PAT_TOKEN }}     # 👈 需要在仓库 A 配置 PAT_TOKEN
          event-type: new-dict-available      # 👈 触发信号
