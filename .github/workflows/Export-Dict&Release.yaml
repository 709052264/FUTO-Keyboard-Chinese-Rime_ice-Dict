name: Export RIME Dict & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '输入导出的版本名 (留空则自动生成)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Grant execute permission for export.sh
        run: chmod +x export.sh

      - name: Run export.sh
        id: export
        run: |
          # 计算版本号
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="custom-${GITHUB_RUN_NUMBER}"
          fi
          
          # 存入环境变量，供后续步骤使用
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          
          echo "Using version: $VERSION"
          ./export.sh "$VERSION"
          echo "=== Generated files ==="
          ls -la dict/

      - name: Verify dict file exists
        run: |
          if [ -z "$(ls -A dict/*.dict 2>/dev/null)" ]; then
            echo "No .dict file found!"
            exit 1
          fi

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "dict-${{ env.VERSION }}"
          name: "FUTO Dictionary - ${{ env.VERSION }}"
          body: |
            Automated dictionary export from commit ${{ github.sha }}
            Version: ${{ env.VERSION }}
          draft: false
          prerelease: false
          files: dict/*.dict
