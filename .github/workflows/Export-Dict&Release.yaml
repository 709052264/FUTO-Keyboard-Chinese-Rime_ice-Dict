name: Export RIME Dict & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '输入导出的版本名 (留空则自动生成)'
        required: false
        default: ''
  # 当同步词库的 Action 运行完成后，自动触发此 Action
  workflow_run:
    workflows: ["Sync Rime Ice Dicts"] # 注意：必须和第一个 Action 的 name 完全一致
    types:
      - completed

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repo A
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Grant execute permission for export.sh
        run: chmod +x export.sh

      - name: Run export.sh
        id: export
        run: |
          # 计算版本号
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="custom-${GITHUB_RUN_NUMBER}"
          fi
          
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Using version: $VERSION"
          
          ./export.sh "$VERSION"
          
          # 👇【关键修复】：将生成的文件统一重命名为 rime_ice.dict，方便固定下载链接
          echo "Renaming generated dict to rime_ice.dict..."
          mv dict/*.dict dict/rime_ice.dict
          
          echo "=== Generated files ==="
          ls -la dict/

      - name: Verify dict file exists
        run: |
          if [ ! -f "dict/rime_ice.dict" ]; then
            echo "No dict/rime_ice.dict file found!"
            exit 1
          fi

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "dict-${{ env.VERSION }}"
          name: "FUTO Keyboard Chinese Dict Rime_Ice - ${{ env.VERSION }}"
          body: |
            Automated dictionary export from commit ${{ github.sha }}
            Version: ${{ env.VERSION }}
          draft: false
          prerelease: false
          files: dict/rime_ice.dict # 👈 使用固定文件名上传

      # ==========================================
      # 👇 下面是同步到仓库 B 的步骤
      # ==========================================
      
      - name: Checkout Target Repo (futo-keyboard)
        uses: actions/checkout@v4
        with:
          repository: 709052264/futo-keyboard
          token: ${{ secrets.PAT_TOKEN }} # 使用万能钥匙 PAT_TOKEN
          ref: main                       # 目标仓库分支
          path: target-repo               # 拉取到 target-repo 目录下

      - name: Copy Dict and Push to Repo B
        run: |
          cd target-repo
          
          # 1. 确保目标目录存在（防止因为目录结构变动报错）
          mkdir -p java/assets
          
          # 2. 覆盖目标仓库的词典文件
          echo "Copying rime_ice.dict to java/assets/builtin.dict..."
          cp ../dict/rime_ice.dict java/assets/builtin.dict
          
          # 3. 配置 Git 信息
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 4. 检查是否有变化，有变化才提交（防止空跑报错）
          if git diff --quiet java/assets/builtin.dict; then
            echo "No changes in builtin.dict. Skipping push."
          else
            echo "Dictionary updated! Committing and pushing to Repo B..."
            git add java/assets/builtin.dict
            git commit -m "chore: auto-update builtin dict from Repo A release (v${{ env.VERSION }})"
            git push
            echo "Push successful! This should trigger the build action in Repo B."
          fi
