name: Export RIME Dict & Release

on:
  # 注释掉 push，完全改为手动触发
  # push:
  #   branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: '输入导出的版本名 (留空则自动生成)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Grant execute permission for export.sh
        run: chmod +x export.sh

      - name: Run export.sh
        run: |
          # 如果手动输入了 version 就用输入的，否则用运行序号
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="custom-${GITHUB_RUN_NUMBER}"
          fi
          
          echo "Using version: $VERSION"
          ./export.sh "$VERSION"
          echo "=== Generated files ==="
          ls -la dict/

      - name: Verify dict file exists
        run: |
          if [ -z "$(ls -A dict/*.dict 2>/dev/null)" ]; then
            echo "No .dict file found!"
            exit 1
          fi

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Tag 和 Release 标题也会使用这个版本号
          tag_name: "dict-${{ github.event.inputs.version || github.run_number }}"
          name: "FUTO Dictionary - ${{ github.event.inputs.version || github.run_number }}"
          body: |
            Automated dictionary export from commit ${{ github.sha }}
            Version: ${{ github.event.inputs.version || 'custom-' + github.run_number }}
          draft: false
          prerelease: false
          files: dict/*.dict
