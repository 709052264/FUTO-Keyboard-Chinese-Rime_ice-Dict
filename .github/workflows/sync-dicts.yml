name: Sync Rime Ice Dicts

on:
  workflow_dispatch:
  schedule:
    # 每月 1 号 UTC 00:00（北京时间早上 8 点）自动同步一次
    - cron: '0 0 1 * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and Extract Dictionaries
        run: |
          # 1. 下载 en_dicts.zip 和 cn_dicts.zip
          echo "Downloading en_dicts.zip..."
          curl -fsSL -o en_dicts.zip "https://github.com/iDvel/rime-ice/releases/download/nightly/en_dicts.zip"

          echo "Downloading cn_dicts.zip..."
          curl -fsSL -o cn_dicts.zip "https://github.com/iDvel/rime-ice/releases/download/nightly/cn_dicts.zip"

          # 2. 解压到仓库根目录，-o 表示覆盖同名文件
          echo "Extracting en_dicts.zip..."
          unzip -o en_dicts.zip

          echo "Extracting cn_dicts.zip..."
          unzip -o cn_dicts.zip

          # 3. 清理压缩包
          rm en_dicts.zip cn_dicts.zip

      - name: Check Changes
        id: check_changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected:"
            git status --porcelain
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected."
          fi

      - name: Commit and Push
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: monthly sync rime-ice dictionaries ($(date +'%Y-%m'))"
          git push
